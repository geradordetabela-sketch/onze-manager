<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onze Manager</title>
<style>
:root{--green:#176b3a;--green2:#24864c;--grass:#eaf4e9;--line:#cbdcc9;--ink:#193124;--gold:#f1c75b}
*{box-sizing:border-box}body{margin:0;background:#f3f7f1;color:var(--ink);font:15px/1.5 system-ui,Arial,sans-serif}
header{background:var(--green);color:white;padding:18px max(16px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:25px}header p{margin:3px 0 0;color:#d9efdd}button,select{font:inherit;border-radius:7px;border:1px solid #b9cfba;padding:8px 10px;background:white;color:var(--ink);cursor:pointer}button:hover{filter:brightness(.96)}button.primary{background:var(--green2);border-color:var(--green2);color:white;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1100px;margin:18px auto;padding:0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:14px}.stat span{display:block;color:#56705d;font-size:12px}.stat b{font-size:21px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap}.nav button.active{background:var(--green);color:white;border-color:var(--green)}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:15px 0 8px}.muted{color:#617565}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:var(--grass);border:1px solid #d5e5d3;border-radius:8px;padding:12px}.tile b{display:block;font-size:17px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #e1eae0;white-space:nowrap}th{color:#56705d}.good{color:#18753d}.bad{color:#b63838}.notice{background:#f7f3d9;border:1px solid #e6d98d;border-radius:8px;padding:10px;margin-top:10px}.footer{text-align:center;color:#718574;font-size:12px;padding:20px}.pill{display:inline-block;padding:2px 7px;border-radius:20px;background:#eaf4e9;border:1px solid #cbdcc9;font-size:12px}.bar{height:7px;background:#e4ebe2;border-radius:8px;overflow:hidden;min-width:70px}.bar span{display:block;height:100%;background:var(--green2)}.profile{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fbfdf9}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.profile-stat{background:var(--grass);padding:9px;border-radius:7px}.profile-stat span{display:block;font-size:12px;color:#56705d}.profile-stat b{font-size:18px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pitch{background:linear-gradient(#3b9653,#287b41);border:3px solid #e4f0df;border-radius:12px;padding:12px;color:white;display:grid;grid-template-rows:repeat(4,minmax(68px,auto));gap:8px;position:relative}.pitch-row{display:flex;justify-content:space-evenly;align-items:center;gap:6px}.pitch-slot{border:1px solid #d6edce;background:#ffffffed;color:#193124;border-radius:8px;padding:7px 5px;text-align:center;width:100%;max-width:145px;min-width:0}.pitch-slot small{display:block;color:#55705c;font-size:11px}.pitch-slot b{display:block;font-size:12px;overflow-wrap:anywhere}.pitch-slot button{padding:3px 6px;font-size:11px;margin-top:4px}.lineup-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}.bench-list{display:grid;gap:7px}.bench-player{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;background:#f4f8f2;border:1px solid var(--line);border-radius:8px}.bench-player small{display:block;color:#617565}.lineup-controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}@media(max-width:760px){.lineup-layout{grid-template-columns:1fr}.pitch{grid-template-rows:repeat(4,minmax(60px,auto))}.pitch-slot{padding:5px 3px}.pitch-slot b{font-size:11px}}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:15px}main{margin-top:12px}.stat b{font-size:18px}}
</style>
</head>
<body>
<header><div><h1>⚽ Onze Manager</h1><p>Monte seu elenco, desenvolva talentos e dispute o campeonato.</p></div><div><button onclick="save()">Salvar jogo</button> <button onclick="newGame()">Novo jogo</button></div></header>
<main><div class="stats" id="stats"></div><nav class="nav" id="nav"></nav><section id="view"></section><div class="footer">Onze Manager • Jogo de futebol independente • O progresso fica salvo neste navegador.</div></main>
<script>
const names=["Aurora FC","Atlético do Vale","Bonsucesso","Capital Esporte","Estrela do Norte","Ferroviário Azul","Grêmio da Serra","Imperial FC","Juventude Real","Litorâneo","Nacional Verde","União Central"];
const first=["Caio","Davi","Enzo","Felipe","Gabriel","Heitor","Igor","João","Lucas","Mateus","Nicolas","Pedro","Rafael","Samuel","Thiago","Vitor","Yuri","Bruno","Danilo","Murilo"];
const last=["Almeida","Barbosa","Carvalho","Dias","Ferreira","Gomes","Lima","Mendes","Oliveira","Pereira","Ribeiro","Santos","Teixeira","Vieira","Costa","Martins"];
const positions=["GOL","ZAG","ZAG","LAT","LAT","VOL","MEI","MEI","PD","PE","ATA","ATA"];
const $=id=>document.getElementById(id), money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function player(id,club){let ovr=45+Math.floor(Math.random()*31),age=18+Math.floor(Math.random()*17),potential=clamp(ovr+Math.floor(Math.random()*19),ovr,95);let p={id,club,name:first[Math.floor(Math.random()*first.length)]+" "+last[Math.floor(Math.random()*last.length)],pos:positions[Math.floor(Math.random()*positions.length)],age,ovr,potential,attack:ovr+Math.floor(Math.random()*13)-6,defense:ovr+Math.floor(Math.random()*13)-6,technique:ovr+Math.floor(Math.random()*13)-6,physical:ovr+Math.floor(Math.random()*13)-6,morale:65+Math.floor(Math.random()*31),fitness:85+Math.floor(Math.random()*16),wage:Math.round((ovr-30)*650),value:ovr*ovr*1800,goals:0,contract:1+Math.floor(Math.random()*4),injury:0};return normalizePlayer(p)}
function normalizePlayer(p){p.potential=Number(p.potential)||clamp((p.ovr||50)+10,40,95);p.attack=Number(p.attack)||p.ovr;p.defense=Number(p.defense)||p.ovr;p.technique=Number(p.technique)||p.ovr;p.physical=Number(p.physical)||p.ovr;p.morale=Number.isFinite(p.morale)?p.morale:75;p.fitness=Number.isFinite(p.fitness)?p.fitness:90;p.contract=Number(p.contract)||2;p.injury=Number(p.injury)||0;p.goals=Number(p.goals)||0;return p}
function initial(){let clubs=names.map((name,id)=>({id,name,pts:0,w:0,d:0,l:0,gf:0,ga:0})),players=[],id=1;clubs.forEach(c=>{for(let i=0;i<20;i++)players.push(player(id++,c.id))});return{clubs,players,club:0,round:1,season:2026,cash:6500000,sponsor:320000,gate:180000,tab:"inicio",message:"Bem-vindo! Você é o novo treinador do Aurora FC.",history:[],selectedPlayer:null,lineup:[] }}
let s;try{s=JSON.parse(localStorage.getItem("onzeManager"))||initial();s.players=(s.players||[]).map(normalizePlayer);s.history=s.history||[];s.selectedPlayer=s.selectedPlayer||null;s.lineup=Array.isArray(s.lineup)?s.lineup:[];s.clubs=s.clubs||initial().clubs;s.tab=s.tab||"inicio"}catch(e){s=initial()}
function save(){localStorage.setItem("onzeManager",JSON.stringify(s));s.message="Jogo salvo neste navegador.";render()}
function newGame(){if(confirm("Começar um jogo novo? O progresso atual será substituído.")){s=initial();render()}}
function myClub(){return s.clubs[s.club]}function squad(){return s.players.filter(p=>p.club===s.club)}function payroll(){return squad().reduce((a,p)=>a+p.wage,0)}
function standings(){return [...s.clubs].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga))}
function avgTeam(id){let ps=s.players.filter(p=>p.club===id);return ps.length?ps.reduce((a,p)=>a+p.ovr,0)/ps.length:40}
function updateValue(p){p.ovr=Math.round((p.attack+p.defense+p.technique+p.physical)/4);p.value=Math.round(p.ovr*p.ovr*1800*(p.age<23?1.12:1)*(0.8+p.morale/250));p.wage=Math.round((p.ovr-30)*650);return p}
const tabs=[["inicio","Visão geral"],["escalacao","Escalação"],["elenco","Elenco"],["mercado","Mercado"],["campeonato","Campeonato"],["financas","Finanças"]];
function render(){let c=myClub();$("stats").innerHTML=[["Caixa",money(s.cash)],["Folha semanal",money(payroll())],["Jogadores",squad().length],["Rodada",s.round>22?"Final":s.round+"/22"]].map(a=>'<div class="stat"><span>'+a[0]+'</span><b>'+a[1]+'</b></div>').join("");$("nav").innerHTML=tabs.map(([id,label])=>'<button class="'+(s.tab===id?"active":"")+'" onclick="s.tab=\''+id+'\';render()">'+label+'</button>').join("");let html="";
if(s.tab==="inicio"){let rank=standings().findIndex(x=>x.id===s.club)+1,avg=Math.round(avgTeam(s.club));html='<div class="panel"><div class="row"><div><h2>'+c.name+'</h2><p class="muted">Temporada '+s.season+' • '+(s.round<=22?"Rodada "+s.round:"Temporada encerrada")+'</p></div><button class="primary" onclick="playRound()" '+(s.round>22?"disabled":"")+'>'+(s.round>22?"Temporada encerrada":"Jogar próxima rodada")+'</button></div><div class="grid"><div class="tile"><span class="muted">Posição no campeonato</span><b>'+rank+'º lugar</b></div><div class="tile"><span class="muted">Força média do elenco</span><b>'+avg+' OVR</b></div><div class="tile"><span class="muted">Receitas por rodada</span><b>'+money(s.sponsor+s.gate)+'</b></div><div class="tile"><span class="muted">Próximo passo</span><b>Treine seus talentos</b></div></div><div class="notice">'+s.message+'</div></div><div class="panel"><h2>Últimos resultados</h2>'+(s.history.length?s.history.slice(-5).reverse().map(x=>'<p>'+x+'</p>').join(""):'<p class="muted">Ainda não houve partidas. Clique em “Jogar próxima rodada” para começar.</p>')+'</div>'}
if(s.tab==="escalacao"){html=lineupMarkup()}
if(s.tab==="elenco"){let ps=squad().sort((a,b)=>b.ovr-a.ovr);html='<div class="panel"><div class="row"><div><h2>Elenco do '+c.name+'</h2><p class="muted">Clique em “Perfil” para ver atributos, potencial e desenvolvimento.</p></div><span class="pill">'+ps.length+' jogadores</span></div><div class="tablewrap"><table><thead><tr><th>Jogador</th><th>Pos.</th><th>Idade</th><th>OVR</th><th>Pot.</th><th>Forma</th><th>Salário/sem.</th><th>Ações</th></tr></thead><tbody>'+ps.map(p=>'<tr><td><b>'+p.name+'</b>'+(p.injury>0?' <span class="bad">🤕</span>':'')+'</td><td>'+p.pos+'</td><td>'+p.age+'</td><td><b>'+p.ovr+'</b></td><td>'+p.potential+'</td><td><div class="bar"><span style="width:'+p.fitness+'%"></span></div>'+p.fitness+'%</td><td>'+money(p.wage)+'</td><td><div class="actions"><button onclick="profile('+p.id+')">Perfil</button><button onclick="train('+p.id+')">Treinar</button><button onclick="sell('+p.id+')">Vender</button></div></td></tr>').join("")+'</tbody></table></div><div id="playerProfile">'+profileMarkup()+'</div></div>'}
if(s.tab==="mercado"){let ps=s.players.filter(p=>p.club!==s.club).sort((a,b)=>b.ovr-a.ovr).slice(0,40);html='<div class="panel"><h2>Mercado de transferências</h2><p class="muted">Confira idade, potencial e condição física antes de investir. Os preços são pagos à vista.</p><div class="tablewrap"><table><thead><tr><th>Jogador</th><th>Clube</th><th>Pos.</th><th>Idade</th><th>OVR</th><th>Potencial</th><th>Condição</th><th>Valor</th><th>Ação</th></tr></thead><tbody>'+ps.map(p=>'<tr><td>'+p.name+'</td><td>'+s.clubs[p.club].name+'</td><td>'+p.pos+'</td><td>'+p.age+'</td><td>'+p.ovr+'</td><td>'+p.potential+'</td><td>'+p.fitness+'%</td><td>'+money(p.value)+'</td><td><button onclick="buy('+p.id+')">Contratar</button></td></tr>').join("")+'</tbody></table></div></div>'}
if(s.tab==="campeonato"){html='<div class="panel"><div class="row"><h2>Campeonato Nacional</h2><span class="muted">Temporada '+s.season+'</span></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Clube</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>'+standings().map((x,i)=>'<tr style="'+(x.id===s.club?'background:#eaf4e9;font-weight:bold':'')+'"><td>'+(i+1)+'</td><td>'+x.name+'</td><td>'+x.pts+'</td><td>'+(x.w+x.d+x.l)+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+x.gf+'</td><td>'+x.ga+'</td><td>'+(x.gf-x.ga)+'</td></tr>').join("")+'</tbody></table></div>'+(s.round>22?'<p><button class="primary" onclick="nextSeason()">Começar temporada '+(s.season+1)+'</button></p>':'')+'</div>'}
if(s.tab==="financas"){html='<div class="panel"><h2>Finanças do clube</h2><div class="grid"><div class="tile"><span>Caixa atual</span><b>'+money(s.cash)+'</b></div><div class="tile"><span>Patrocínio/rodada</span><b>'+money(s.sponsor)+'</b></div><div class="tile"><span>Bilheteria/rodada</span><b>'+money(s.gate)+'</b></div><div class="tile"><span>Folha semanal</span><b>'+money(payroll())+'</b></div></div><h3>Melhorar receitas</h3><p><button class="primary" onclick="sponsor()">Negociar patrocínio · R$ 100.000</button> <button onclick="campaign()">Campanha de sócios · R$ 75.000</button></p><p class="muted">A cada rodada, o clube recebe patrocínio e bilheteria e paga os salários.</p></div>'}
$("view").innerHTML=html}
function lineupIds(){const valid=new Set(squad().map(p=>p.id));s.lineup=(s.lineup||[]).filter(id=>valid.has(id));const unique=[...new Set(s.lineup)];s.lineup=unique.slice(0,11);if(!s.lineup.length){const suggested=chooseLineup();s.lineup=suggested.map(p=>p.id)}return s.lineup}
function lineupMarkup(){const ids=lineupIds(),chosen=ids.map(id=>s.players.find(p=>p.id===id)).filter(Boolean),available=squad().filter(p=>!ids.includes(p.id)).sort((a,b)=>b.ovr-a.ovr),positionsMap=[["ATA",[0,1,2]],["MEI",[3,4,5]],["DEF",[6,7,8,9]],["GOL",[10]]],rows=[chosen.slice(8,11),chosen.slice(5,8),chosen.slice(1,5),chosen.slice(0,1)];const slots=rows.map((row,i)=>'<div class="pitch-row">'+row.map(p=>'<div class="pitch-slot"><small>'+p.pos+' · '+p.ovr+' OVR</small><b>'+p.name+'</b><small>'+p.fitness+'% físico'+(p.injury?' · lesionado':'')+'</small><button onclick="removeFromLineup('+p.id+')">Retirar</button></div>').join('')+'</div>').join('');return '<div class="panel"><div class="row"><div><h2>Escalação titular</h2><p class="muted">Escolha até 11 titulares. A seleção será usada nas próximas partidas.</p></div><span class="pill">'+chosen.length+'/11 titulares</span></div><div class="lineup-controls"><button class="primary" onclick="autoLineup()">Escalação automática</button><button onclick="clearLineup()">Limpar escalação</button></div><div class="lineup-layout"><div><h3>Campo</h3><div class="pitch">'+slots+'</div><p class="muted">Visualização por setor; os jogadores são listados do ataque ao gol.</p></div><div><h3>Banco e elenco disponível</h3><p class="muted">Adicione jogadores aptos para completar seus titulares. Lesionados não podem ser escalados.</p><div class="bench-list">'+(available.length?available.map(p=>'<div class="bench-player"><div><b>'+p.name+'</b><small>'+p.pos+' · '+p.ovr+' OVR · '+p.fitness+'% físico'+(p.injury?' · Lesionado':'')+'</small></div><button '+(p.injury>0||chosen.length>=11?'disabled':'')+' onclick="addToLineup('+p.id+')">Escalar</button></div>').join(''):'<p class="muted">Todos os jogadores aptos já estão escalados.</p>')+'</div></div></div><div class="notice">'+(chosen.length===11?'Escalação completa. Estes 11 jogadores serão considerados titulares na próxima rodada.':'Escolha mais '+(11-chosen.length)+' jogador(es) para completar a escalação.')+'</div></div>'}
function addToLineup(id){const p=s.players.find(x=>x.id===id&&x.club===s.club);if(!p||p.injury>0)return;const ids=lineupIds();if(ids.length>=11){s.message="A escalação já tem 11 jogadores. Retire um titular antes de adicionar outro.";render();return}if(!ids.includes(id))ids.push(id);s.lineup=ids;s.message=p.name+" foi escalado como titular.";render()}
function removeFromLineup(id){s.lineup=lineupIds().filter(x=>x!==id);s.message="Jogador removido da escalação titular.";render()}
function autoLineup(){s.lineup=chooseLineup().map(p=>p.id);s.message="Escalação automática definida com os melhores jogadores disponíveis por posição.";render()}
function clearLineup(){s.lineup=[];s.message="Escalação limpa. Você pode selecionar os titulares manualmente.";render()}
function profileMarkup(){let p=s.players.find(x=>x.id===s.selectedPlayer&&x.club===s.club);if(!p)return '';return '<div class="profile"><div class="row"><div><h2>'+p.name+'</h2><span class="pill">'+p.pos+'</span> <span class="pill">'+p.age+' anos</span> <span class="pill">Contrato: '+p.contract+' temporada(s)</span></div><button onclick="s.selectedPlayer=null;render()">Fechar perfil</button></div><div class="profile-grid"><div class="profile-stat"><span>Overall (OVR)</span><b>'+p.ovr+'</b></div><div class="profile-stat"><span>Potencial</span><b>'+p.potential+'</b></div><div class="profile-stat"><span>Moral</span><b>'+p.morale+'/100</b></div><div class="profile-stat"><span>Condição física</span><b>'+p.fitness+'%</b></div><div class="profile-stat"><span>Valor estimado</span><b>'+money(p.value)+'</b></div><div class="profile-stat"><span>Salário semanal</span><b>'+money(p.wage)+'</b></div></div><h3>Atributos</h3>'+[['Ataque',p.attack],['Defesa',p.defense],['Técnica',p.technique],['Físico',p.physical]].map(a=>'<div class="row"><span>'+a[0]+'</span><b>'+a[1]+'</b></div><div class="bar" style="margin:3px 0 9px"><span style="width:'+a[1]+'%"></span></div>').join('')+'<p class="muted">Potencial indica o nível que o jogador pode alcançar. Treinar custa R$ 8.000 e consome parte da condição física.</p></div>'}
function profile(id){s.selectedPlayer=id;render();let el=$("playerProfile");if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"})}
function train(id){let p=s.players.find(x=>x.id===id&&x.club===s.club);if(!p)return;if(s.cash<8000){alert("Caixa insuficiente para pagar o treino (R$ 8.000).");return}if(p.fitness<25){alert("O jogador está cansado demais. Use Descansar primeiro.");return}if(p.injury>0){alert("O jogador está lesionado e não pode treinar agora.");return}if(p.ovr>=p.potential){alert("Este jogador já atingiu o potencial atual.");return}s.cash-=8000;p.fitness=clamp(p.fitness-12,0,100);p.morale=clamp(p.morale+2,0,100);let attr=["attack","defense","technique","physical"].filter(k=>p[k]<p.potential);if(!attr.length){alert("Todos os atributos já atingiram o potencial.");return}let key=attr[Math.floor(Math.random()*attr.length)],chance=p.age<=23?.72:p.age<=28?.42:.2;if(Math.random()<chance)p[key]=clamp(p[key]+1,1,p.potential);updateValue(p);s.message="Treino concluído para "+p.name+". "+({attack:"Ataque",defense:"Defesa",technique:"Técnica",physical:"Físico"}[key])+(p[key]>0?" trabalhado.":"") ;s.selectedPlayer=id;render()}
function rest(id){let p=s.players.find(x=>x.id===id&&x.club===s.club);if(!p)return;let before=p.fitness;p.fitness=clamp(p.fitness+25,0,100);p.morale=clamp(p.morale+3,0,100);if(p.injury>0)p.injury=Math.max(0,p.injury-1);s.message=p.name+" descansou e recuperou "+(p.fitness-before)+" pontos de condição.";s.selectedPlayer=id;render()}
function chooseLineup(){const r=squad().filter(p=>p.injury===0),out=[],slots=["GOL","ZAG","ZAG","LAT","LAT","VOL","MEI","MEI","PD","ATA","ATA"];slots.forEach(pos=>{let list=r.filter(p=>p.pos===pos);if(!list.length)list=r;if(list.length){list.sort((a,b)=>b.ovr-a.ovr);out.push(list[0]);r.splice(r.indexOf(list[0]),1)}});return out}
function playRound(){if(s.round>22)return;const savedIds=lineupIds(),xi=savedIds.length===11?savedIds.map(id=>s.players.find(p=>p.id===id)).filter(p=>p&&p.club===s.club&&p.injury===0):chooseLineup();if(xi.length<11){s.message="Defina 11 titulares aptos na aba Escalação antes de jogar.";s.tab="escalacao";render();return}const ids=new Set(xi.map(p=>p.id)),arr=s.clubs.map(c=>c.id),matches=[];for(let i=0;i<6;i++){let a=arr[i],b=arr[11-i];if(s.round%2===0)[a,b]=[b,a];let aa=s.clubs[a],bb=s.clubs[b],g1=Math.max(0,Math.min(5,Math.round(Math.random()*2+(avgTeam(a)-avgTeam(b))/18+(a===s.club?.4:0)))),g2=Math.max(0,Math.min(5,Math.round(Math.random()*2+(avgTeam(b)-avgTeam(a))/18)));aa.gf+=g1;aa.ga+=g2;bb.gf+=g2;bb.ga+=g1;if(g1>g2){aa.pts+=3;aa.w++;bb.l++}else if(g1<g2){bb.pts+=3;bb.w++;aa.l++}else{aa.pts++;bb.pts++;aa.d++;bb.d++}if(a===s.club||b===s.club){matches.push(aa.name+" "+g1+"–"+g2+" "+bb.name);let scorers=xi.filter(p=>p.pos!=="GOL");if(scorers.length&&g1+g2)scorers[Math.floor(Math.random()*scorers.length)].goals+=Math.max(1,Math.floor((g1+g2)/2))}}let rested=0,injured=0;s.players.forEach(p=>{if(p.club!==s.club)return;if(ids.has(p.id)){p.fitness=clamp(p.fitness-10-Math.floor(Math.random()*8),15,100);if(Math.random()<.025){p.injury=1+Math.floor(Math.random()*3);injured++}}else{rested++;p.fitness=clamp(p.fitness+(p.injury>0?8:18),0,100);if(p.injury>0)p.injury=Math.max(0,p.injury-1);else p.morale=clamp(p.morale+1,0,100)}if(p.contract===0)p.morale=clamp(p.morale-2,0,100);if(p.injury===0&&p.age<24&&p.ovr<p.potential&&Math.random()<.18){let k=["attack","defense","technique","physical"][Math.floor(Math.random()*4)];p[k]=clamp(p[k]+1,1,p.potential);updateValue(p)}});s.cash+=s.sponsor+s.gate-payroll()+Math.floor(Math.random()*80001)-40000;s.history=s.history||[];s.history.push("Rodada "+s.round+": "+matches.join(" | ")+" • "+xi.length+" titulares");s.message="Rodada concluída: "+xi.length+" titulares jogaram e "+rested+" descansaram automaticamente. "+(injured?injured+" jogador(es) sofreram lesão. ":"")+"Os reservas recuperam condicionamento.";s.round++;if(s.round===23)s.message="Campeonato encerrado! Confira a tabela e comece uma nova temporada.";render()}
function buy(id){let p=s.players.find(x=>x.id===id);if(!p||s.cash<p.value){alert("Caixa insuficiente para contratar este jogador.");return}if(squad().length>=30){alert("Seu elenco já tem 30 jogadores.");return}if(confirm("Contratar "+p.name+" por "+money(p.value)+"?")){s.cash-=p.value;p.club=s.club;p.contract=Math.max(1,p.contract);s.message=p.name+" foi contratado.";render()}}
function sell(id){let p=s.players.find(x=>x.id===id);if(!p)return;if(squad().length<=11){alert("Mantenha pelo menos 11 jogadores no elenco.");return}if(confirm("Vender "+p.name+" por "+money(Math.round(p.value*.7))+"?")){s.cash+=Math.round(p.value*.7);s.players=s.players.filter(x=>x.id!==id);s.selectedPlayer=null;s.message=p.name+" foi vendido.";render()}}
function sponsor(){if(s.cash<100000){alert("Caixa insuficiente.");return}s.cash-=100000;s.sponsor+=25000;s.message="Patrocínio fechado! Receita aumentou R$ 25 mil por rodada.";render()}
function campaign(){if(s.cash<75000){alert("Caixa insuficiente.");return}s.cash-=75000;s.gate+=18000;s.message="Campanha de sócios concluída! Bilheteria aumentou R$ 18 mil por rodada.";render()}
function nextSeason(){s.clubs.forEach(c=>{c.pts=c.w=c.d=c.l=c.gf=c.ga=0});s.round=1;s.season++;s.cash+=300000;s.players.forEach(p=>{if(p.club===s.club){p.age++;p.contract=Math.max(0,p.contract-1);p.fitness=100;p.injury=0;if(p.age>30&&Math.random()<.25){p.attack=clamp(p.attack-1,1,99);p.physical=clamp(p.physical-1,1,99);updateValue(p)}else if(p.age<25&&p.ovr<p.potential&&Math.random()<.55){let key=["attack","defense","technique","physical"][Math.floor(Math.random()*4)];p[key]=clamp(p[key]+1,1,p.potential);updateValue(p)}}});s.message="Nova temporada iniciada. Bônus de preparação: R$ 300 mil. Idades e contratos foram atualizados.";s.selectedPlayer=null;render()}
render();
</script>
