<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onze Manager</title>
<style>
:root{--green:#176b3a;--green2:#24864c;--grass:#eaf4e9;--line:#cbdcc9;--ink:#193124;--gold:#f1c75b}
*{box-sizing:border-box}body{margin:0;background:#f3f7f1;color:var(--ink);font:15px/1.5 system-ui,Arial,sans-serif}
header{background:var(--green);color:white;padding:18px max(16px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:25px}header p{margin:3px 0 0;color:#d9efdd}button,select{font:inherit;border-radius:7px;border:1px solid #b9cfba;padding:9px 12px;background:white;color:var(--ink);cursor:pointer}button:hover{filter:brightness(.96)}button.primary{background:var(--green2);border-color:var(--green2);color:white;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1100px;margin:18px auto;padding:0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:14px}.stat span{display:block;color:#56705d;font-size:12px}.stat b{font-size:21px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap}.nav button.active{background:var(--green);color:white;border-color:var(--green)}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:15px 0 8px}.muted{color:#617565}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:var(--grass);border:1px solid #d5e5d3;border-radius:8px;padding:12px}.tile b{display:block;font-size:17px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #e1eae0;white-space:nowrap}th{color:#56705d}.good{color:#18753d}.bad{color:#b63838}.notice{background:#f7f3d9;border:1px solid #e6d98d;border-radius:8px;padding:10px;margin-top:10px}.footer{text-align:center;color:#718574;font-size:12px;padding:20px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{padding:15px}main{margin-top:12px}.stat b{font-size:18px}}
</style>
</head>
<body>
<header><div><h1>⚽ Onze Manager</h1><p>Monte seu elenco, dispute o campeonato e cuide das finanças.</p></div><div><button onclick="save()">Salvar jogo</button> <button onclick="newGame()">Novo jogo</button></div></header>
<main><div class="stats" id="stats"></div><nav class="nav" id="nav"></nav><section id="view"></section><div class="footer">Onze Manager • Jogo de futebol independente • O progresso fica salvo neste navegador.</div></main>
<script>
const names=["Aurora FC","Atlético do Vale","Bonsucesso","Capital Esporte","Estrela do Norte","Ferroviário Azul","Grêmio da Serra","Imperial FC","Juventude Real","Litorâneo","Nacional Verde","União Central"];
const first=["Caio","Davi","Enzo","Felipe","Gabriel","Heitor","Igor","João","Lucas","Mateus","Nicolas","Pedro","Rafael","Samuel","Thiago","Vitor","Yuri","Bruno","Danilo","Murilo"];
const last=["Almeida","Barbosa","Carvalho","Dias","Ferreira","Gomes","Lima","Mendes","Oliveira","Pereira","Ribeiro","Santos","Teixeira","Vieira","Costa","Martins"];
const positions=["GOL","ZAG","ZAG","LAT","LAT","VOL","MEI","MEI","PD","PE","ATA","ATA"];
const $=id=>document.getElementById(id), money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
function player(id,club){let ovr=45+Math.floor(Math.random()*31);return{id,club,name:first[Math.floor(Math.random()*first.length)]+" "+last[Math.floor(Math.random()*last.length)],pos:positions[Math.floor(Math.random()*positions.length)],age:18+Math.floor(Math.random()*17),ovr,wage:Math.round((ovr-30)*650),value:ovr*ovr*1800,goals:0}}
function initial(){let clubs=names.map((name,id)=>({id,name,pts:0,w:0,d:0,l:0,gf:0,ga:0})),players=[],id=1;clubs.forEach(c=>{for(let i=0;i<20;i++)players.push(player(id++,c.id))});return{clubs,players,club:0,round:1,season:2026,cash:6500000,sponsor:320000,gate:180000,tab:"inicio",message:"Bem-vindo! Você é o novo treinador do Aurora FC."}}
let s;try{s=JSON.parse(localStorage.getItem("onzeManager"))||initial()}catch(e){s=initial()}
function save(){localStorage.setItem("onzeManager",JSON.stringify(s));s.message="Jogo salvo neste navegador.";render()}
function newGame(){if(confirm("Começar um jogo novo? O progresso atual será substituído.")){s=initial();render()}}
function myClub(){return s.clubs[s.club]}function squad(){return s.players.filter(p=>p.club===s.club)}function payroll(){return squad().reduce((a,p)=>a+p.wage,0)}
function standings(){return [...s.clubs].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga))}
const tabs=[["inicio","Visão geral"],["elenco","Elenco"],["mercado","Mercado"],["campeonato","Campeonato"],["financas","Finanças"]];
function render(){let c=myClub();$("stats").innerHTML=[["Caixa",money(s.cash)],["Folha semanal",money(payroll())],["Jogadores",squad().length],["Rodada",s.round>22?"Final":s.round+"/22"]].map(a=>'<div class="stat"><span>'+a[0]+'</span><b>'+a[1]+'</b></div>').join("");$("nav").innerHTML=tabs.map(([id,label])=>'<button class="'+(s.tab===id?"active":"")+'" onclick="s.tab=\''+id+'\';render()">'+label+'</button>').join("");let html="";
if(s.tab==="inicio"){let rank=standings().findIndex(x=>x.id===s.club)+1,avg=Math.round(squad().reduce((a,p)=>a+p.ovr,0)/Math.max(1,squad().length));html='<div class="panel"><div class="row"><div><h2>'+c.name+'</h2><p class="muted">Temporada '+s.season+' • '+(s.round<=22?"Rodada "+s.round:"Temporada encerrada")+'</p></div><button class="primary" onclick="playRound()" '+(s.round>22?"disabled":"")+'>'+(s.round>22?"Temporada encerrada":"Jogar próxima rodada")+'</button></div><div class="grid"><div class="tile"><span class="muted">Posição no campeonato</span><b>'+rank+'º lugar</b></div><div class="tile"><span class="muted">Força média do elenco</span><b>'+avg+' OVR</b></div><div class="tile"><span class="muted">Receitas por rodada</span><b>'+money(s.sponsor+s.gate)+'</b></div><div class="tile"><span class="muted">Próximo passo</span><b>Monte seu time</b></div></div><div class="notice">'+s.message+'</div></div><div class="panel"><h2>Últimos resultados</h2>'+(s.history&&s.history.length?s.history.slice(-5).reverse().map(x=>'<p>'+x+'</p>').join(""):'<p class="muted">Ainda não houve partidas. Clique em “Jogar próxima rodada” para começar.</p>')+'</div>'}
if(s.tab==="elenco"){html='<div class="panel"><h2>Elenco do '+c.name+'</h2><div class="tablewrap"><table><thead><tr><th>Jogador</th><th>Pos.</th><th>Idade</th><th>OVR</th><th>Salário/sem.</th><th>Valor</th><th>Ação</th></tr></thead><tbody>'+squad().sort((a,b)=>b.ovr-a.ovr).map(p=>'<tr><td><b>'+p.name+'</b></td><td>'+p.pos+'</td><td>'+p.age+'</td><td>'+p.ovr+'</td><td>'+money(p.wage)+'</td><td>'+money(p.value)+'</td><td><button onclick="sell('+p.id+')">Vender</button></td></tr>').join("")+'</tbody></table></div></div>'}
if(s.tab==="mercado"){let ps=s.players.filter(p=>p.club!==s.club).sort((a,b)=>b.ovr-a.ovr).slice(0,40);html='<div class="panel"><h2>Mercado de transferências</h2><p class="muted">Contrate reforços para melhorar o elenco. Os preços são pagos à vista.</p><div class="tablewrap"><table><thead><tr><th>Jogador</th><th>Clube</th><th>Pos.</th><th>Idade</th><th>OVR</th><th>Valor</th><th>Ação</th></tr></thead><tbody>'+ps.map(p=>'<tr><td>'+p.name+'</td><td>'+s.clubs[p.club].name+'</td><td>'+p.pos+'</td><td>'+p.age+'</td><td>'+p.ovr+'</td><td>'+money(p.value)+'</td><td><button onclick="buy('+p.id+')">Contratar</button></td></tr>').join("")+'</tbody></table></div></div>'}
if(s.tab==="campeonato"){html='<div class="panel"><div class="row"><h2>Campeonato Nacional</h2><span class="muted">Temporada '+s.season+'</span></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Clube</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>'+standings().map((x,i)=>'<tr style="'+(x.id===s.club?'background:#eaf4e9;font-weight:bold':'')+'"><td>'+(i+1)+'</td><td>'+x.name+'</td><td>'+x.pts+'</td><td>'+(x.w+x.d+x.l)+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+x.gf+'</td><td>'+x.ga+'</td><td>'+(x.gf-x.ga)+'</td></tr>').join("")+'</tbody></table></div>'+(s.round>22?'<p><button class="primary" onclick="nextSeason()">Começar temporada '+(s.season+1)+'</button></p>':'')+'</div>'}
if(s.tab==="financas"){html='<div class="panel"><h2>Finanças do clube</h2><div class="grid"><div class="tile"><span>Caixa atual</span><b>'+money(s.cash)+'</b></div><div class="tile"><span>Patrocínio/rodada</span><b>'+money(s.sponsor)+'</b></div><div class="tile"><span>Bilheteria/rodada</span><b>'+money(s.gate)+'</b></div><div class="tile"><span>Folha semanal</span><b>'+money(payroll())+'</b></div></div><h3>Melhorar receitas</h3><p><button class="primary" onclick="sponsor()">Negociar patrocínio · R$ 100.000</button> <button onclick="campaign()">Campanha de sócios · R$ 75.000</button></p><p class="muted">A cada rodada, o clube recebe patrocínio e bilheteria e paga os salários.</p></div>'}
$("view").innerHTML=html}
function playRound(){if(s.round>22)return;let arr=s.clubs.map(c=>c.id),matches=[];for(let i=0;i<6;i++){let a=arr[i],b=arr[11-i];if(s.round%2===0)[a,b]=[b,a];let aa=s.clubs[a],bb=s.clubs[b],avg=id=>{let p=s.players.filter(x=>x.club===id);return p.reduce((z,x)=>z+x.ovr,0)/Math.max(1,p.length)},g1=Math.max(0,Math.min(5,Math.round(Math.random()*2+(avg(a)-avg(b))/18+(a===s.club?0.4:0)))),g2=Math.max(0,Math.min(5,Math.round(Math.random()*2+(avg(b)-avg(a))/18)));aa.gf+=g1;aa.ga+=g2;bb.gf+=g2;bb.ga+=g1;if(g1>g2){aa.pts+=3;aa.w++;bb.l++}else if(g1<g2){bb.pts+=3;bb.w++;aa.l++}else{aa.pts++;bb.pts++;aa.d++;bb.d++}if(a===s.club||b===s.club)matches.push(aa.name+" "+g1+"–"+g2+" "+bb.name)}
s.cash+=s.sponsor+s.gate-payroll()+Math.floor(Math.random()*80001)-40000;s.history=s.history||[];s.history.push("Rodada "+s.round+": "+matches.join(" | "));s.message="Rodada concluída. Saldo: "+money(s.cash);s.round++;if(s.round===23)s.message="Campeonato encerrado! Confira a tabela e comece uma nova temporada.";render()}
function buy(id){let p=s.players.find(x=>x.id===id);if(!p||s.cash<p.value){alert("Caixa insuficiente para contratar este jogador.");return}if(squad().length>=30){alert("Seu elenco já tem 30 jogadores.");return}if(confirm("Contratar "+p.name+" por "+money(p.value)+"?")){s.cash-=p.value;p.club=s.club;s.message=p.name+" foi contratado.";render()}}
function sell(id){let p=s.players.find(x=>x.id===id);if(!p)return;if(squad().length<=11){alert("Mantenha pelo menos 11 jogadores no elenco.");return}if(confirm("Vender "+p.name+" por "+money(Math.round(p.value*.7))+"?")){s.cash+=Math.round(p.value*.7);s.players=s.players.filter(x=>x.id!==id);s.message=p.name+" foi vendido.";render()}}
function sponsor(){if(s.cash<100000){alert("Caixa insuficiente.");return}s.cash-=100000;s.sponsor+=25000;s.message="Patrocínio fechado! Receita aumentou R$ 25 mil por rodada.";render()}
function campaign(){if(s.cash<75000){alert("Caixa insuficiente.");return}s.cash-=75000;s.gate+=18000;s.message="Campanha de sócios concluída! Bilheteria aumentou R$ 18 mil por rodada.";render()}
function nextSeason(){s.clubs.forEach(c=>{c.pts=c.w=c.d=c.l=c.gf=c.ga=0});s.round=1;s.season++;s.cash+=300000;s.message="Nova temporada iniciada. Bônus de preparação: R$ 300 mil.";render()}
render();
</script>
</body>
</html>
